<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아, 그래서 그랬구나</title>
  <style>
    :root {
      --bg: #0e0e14;
      --card-bg: #16161f;
      --accent: #a78bfa;
      --accent2: #7c3aed;
      --text: #f1f0ff;
      --muted: rgba(255,255,255,0.45);
      --border: rgba(167,139,250,0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 60px 20px 36px;
    }

    header .label {
      display: inline-block;
      background: rgba(167,139,250,0.12);
      color: var(--accent);
      font-size: 0.75rem;
      letter-spacing: 2px;
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      margin-bottom: 18px;
    }

    header h1 {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1.2;
    }

    header h1 span { color: var(--accent); }

    header p {
      color: var(--muted);
      margin-top: 12px;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .filter {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 0 20px 36px;
    }

    .filter button {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--muted);
      padding: 7px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .filter button:hover,
    .filter button.active {
      background: var(--accent2);
      border-color: var(--accent);
      color: #fff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px 80px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover { transform: translateY(-4px); border-color: var(--accent); }

    .card-inner {
      padding: 28px 24px;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 16px;
    }

    .card-emoji {
      font-size: 2.2rem;
      flex-shrink: 0;
      line-height: 1;
    }

    .card-category {
      font-size: 0.7rem;
      color: var(--accent);
      letter-spacing: 1.5px;
      margin-bottom: 4px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.4;
      color: var(--text);
    }

    .card-question {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .reveal-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 0.82rem;
      padding: 7px 16px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .reveal-btn:hover { background: rgba(167,139,250,0.1); border-color: var(--accent); }

    .answer-box {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease, padding 0.3s ease;
    }

    .answer-box.open {
      max-height: 300px;
    }

    .answer-inner {
      border-top: 1px solid var(--border);
      margin-top: 16px;
      padding-top: 16px;
    }

    .answer-label {
      font-size: 0.72rem;
      color: var(--accent);
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }

    .answer-text {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.8);
      line-height: 1.7;
    }

    .aha {
      display: inline-block;
      margin-top: 12px;
      background: rgba(167,139,250,0.12);
      color: var(--accent);
      font-size: 0.78rem;
      padding: 4px 12px;
      border-radius: 12px;
    }

    footer {
      text-align: center;
      padding: 24px;
      color: rgba(255,255,255,0.2);
      font-size: 0.8rem;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
  </style>
</head>
<body>

<header>
  <div class="label">HIDDEN REASON</div>
  <h1>아, <span>그래서 그랬구나</span></h1>
  <p>평소엔 당연했는데, 알고 보면 이유가 있었던<br>생활 속 숨겨진 이야기들</p>
</header>

<div class="filter">
  <button class="active" onclick="filterCards('all', this)">전체</button>
  <button onclick="filterCards('생활', this)">생활</button>
  <button onclick="filterCards('음식', this)">음식</button>
  <button onclick="filterCards('교통', this)">교통</button>
  <button onclick="filterCards('제품', this)">제품</button>
  <button onclick="filterCards('건강', this)">건강</button>
</div>

<div class="grid" id="grid"></div>

<footer>알고 나면 다시 보이는 세상 🔍</footer>

    answer: '요일별로 납품 날짜를 표시합니다. 월(파랑), 화(초록), 목(빨강), 금(흰색), 토(노랑)처럼 색으로 구분해 직원이 오래된 제품을 빠르게 골라냅니다.',

function createCard(fact) {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.category = fact.category;
  card.innerHTML = `
    <div class="card-inner">
      <div class="card-top">
        <div class="card-emoji">${fact.emoji}</div>
        <div>
          <div class="card-category">${fact.category}</div>
          <div class="card-title">${fact.title}</div>
        </div>
      </div>
      <div class="card-question">${fact.question}</div>
      <button class="reveal-btn" onclick="toggle(this)">
        <span>💡</span> 이유 알아보기
      </button>
      <div class="answer-box">
        <div class="answer-inner">
          <div class="answer-label">REASON</div>
          <div class="answer-text">${fact.answer}</div>
          <span class="aha">✨ ${fact.aha}</span>
        </div>
      </div>
    </div>
  `;
  return card;
}

function toggle(btn) {
  const box = btn.nextElementSibling;
  const open = box.classList.toggle('open');
  btn.innerHTML = open
    ? '<span>🔼</span> 접기'
    : '<span>💡</span> 이유 알아보기';
  btn.style.color = open ? 'rgba(255,255,255,0.4)' : '';
}

function filterCards(cat, el) {
  document.querySelectorAll('.filter button').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.card').forEach(c => {
    c.style.display = (cat === 'all' || c.dataset.category === cat) ? '' : 'none';
  });
}

const grid = document.getElementById('grid');
facts.forEach(f => grid.appendChild(createCard(f)));
</script>
</body>
</html>
